name: CI

on:
  push:
    paths:
      - "wordclock/**"
      - "tests/**"
    branches: ["main"]
  pull_request:
    paths:
      - "wordclock/**"
      - "tests/**"
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
