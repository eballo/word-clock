[project]
name = "wordclock"
version = "0.1.0"
description = "Rellotge de paraules en català amb LEDs WS2812B (Raspberry Pi)"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.11"
authors = [{ name = "Enric Ballo" }]

dependencies = [
    "flask>=3.1",
    "flask-cors>=5.0",
]

[project.optional-dependencies]
rpi = [
    "rpi-ws281x>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
wordclock     = "wordclock.main:main"
wordclock-api = "wordclock.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=wordclock --cov-report=term-missing -v"